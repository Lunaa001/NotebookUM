version: '3.8'

services:
  redis:
    image: redis:7-bookworm
    container_name: redis
    restart: always
    
    # Volumen para persistencia de datos
    volumes:
      - ./data:/data
    
    # Comando: redis con contraseña requerida
    command: redis-server --loglevel notice --requirepass ${REDIS_PASSWORD:-Qvv3r7y}
    
    # Red compartida con otros servicios
    networks:
      - notebookum-network
    
    # Verificar que Redis está respondiendo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Labels para Traefik (TCP routing)
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.redis.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.redis.entryPoints=redis"
      - "traefik.tcp.routers.redis.service=redis"
      - "traefik.tcp.services.redis.loadbalancer.server.port=6379"

networks:
  notebookum-network:
    external: true