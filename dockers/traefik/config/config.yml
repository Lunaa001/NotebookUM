http:
  middlewares:
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5 || ResponseCodeRatio(500, 600, 0, 600) > 0.3"

    rate-limit:
      rateLimit:
        average: 100
        period: 1s
        burst: 50
        sourceCriterion:
          ipStrategy:
            depth: 1

    request-tracing:
      headers:
        customRequestHeaders:
          X-Service: "NotebookUM-API"
          X-Environment: "production"

    compression:
      compress:
        minResponseBodyBytes: 1024

    cors-headers:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-User-ID"
          - "X-Correlation-ID"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 3600

  routers:
    traefik:
      rule: "Host(`traefik.universidad.localhost`)"
      service: "api@internal"
      entryPoints:
        - http

    controller:
      rule: "Host(`api.universidad.localhost`)"
      service: "controller"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - circuit-breaker
        - request-tracing
        - cors-headers

    user-service:
      rule: "Host(`users.universidad.localhost`)"
      service: "user-service"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - cors-headers

    extract-service:
      rule: "Host(`extractor.universidad.localhost`)"
      service: "extract-service"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - cors-headers

    summary-service:
      rule: "Host(`ai.universidad.localhost`)"
      service: "summary-service"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - cors-headers

    persistence-service:
      rule: "Host(`persistence-java.universidad.localhost`)"
      service: "persistence-service"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - circuit-breaker
        - cors-headers

    consul:
      rule: "Host(`consul.universidad.localhost`)"
      service: "consul"
      entryPoints:
        - http

  services:
    controller:
      loadBalancer:
        servers:
          - url: "http://controller:5000"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 5s

    user-service:
      loadBalancer:
        servers:
          - url: "http://user:5000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    extract-service:
      loadBalancer:
        servers:
          - url: "http://extractor:5000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    summary-service:
      loadBalancer:
        servers:
          - url: "http://ai:5000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    persistence-service:
      loadBalancer:
        servers:
          - url: "http://persistence:8080"
        healthCheck:
          path: /actuator/health
          interval: 30s
          timeout: 5s

    consul:
      loadBalancer:
        servers:
          - url: "http://consul:8500"
