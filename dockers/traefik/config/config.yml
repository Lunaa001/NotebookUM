http:
  middlewares:
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5 || ResponseCodeRatio(500, 600, 0, 600) > 0.3"

    rate-limit:
      rateLimit:
        average: 100
        period: 1s
        burst: 50
        sourceCriterion:
          ipStrategy:
            depth: 1

    request-tracing:
      headers:
        customRequestHeaders:
          X-Service: "NotebookUM-API"
          X-Environment: "production"

    compression:
      compress:
        minResponseBodyBytes: 1024

    cors-headers:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-User-ID"
          - "X-Correlation-ID"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 3600

  # Routers/services for controller-service, user-service, extract-service,
  # summary-service AND persistence-service are intentionally NOT defined
  # here. All five self-register in Consul with valid `traefik.*` tags
  # (persistence-service does so natively via Spring Cloud Consul Discovery;
  # the other four via */app/consul_registration.py and
  # controller-service/internal/config/consul.go, seeded by
  # dockers/consul/kv-seed/seed.sh) and are discovered dynamically through the
  # `consulCatalog` provider (see traefik.yml). A static `persistence-service`
  # router used to be defined here too — verified via the Traefik API that it
  # collided with the auto-discovered one (same Host rule, same priority,
  # provider-nondeterministic winner), so it was removed. Only Consul itself
  # stays static below: it has no Consul tags of its own (it IS the registry),
  # so it cannot be discovered through its own catalog.
  routers:
    traefik:
      rule: "Host(`traefik.universidad.localhost`)"
      service: "api@internal"
      entryPoints:
        - http

    consul:
      rule: "Host(`consul.universidad.localhost`)"
      service: "consul"
      entryPoints:
        - http

  services:
    consul:
      loadBalancer:
        servers:
          - url: "http://consul:8500"
