http:
  middlewares:
    # Circuit breaker middleware
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5 || ResponseCodeRatio(500, 600, 0, 600) > 0.3"
    
    # Rate limiting - 100 requests per second per IP
    rate-limit:
      rateLimit:
        average: 100
        period: 1s
        burst: 50
        sourceCriterion:
          ipStrategy:
            depth: 1
    
    # Request tracing header
    request-tracing:
      headers:
        customRequestHeaders:
          X-Service: "NotebookUM-API"
          X-Environment: "production"
    
    # Compression middleware
    compression:
      compress:
        minResponseBodyBytes: 1024

    # CORS headers for dashboard
    cors-headers:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-User-ID"
          - "X-Correlation-ID"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 3600

  # ─── ROUTERS ────────────────────────────────────────────────────────────────

  routers:
    # Traefik Dashboard
    traefik:
      rule: "Host(`traefik.universidad.localhost`)"
      service: "api@internal"
      entryPoints:
        - http

    # Controller (Go) — API Gateway — :5000
    controller:
      rule: "Host(`controller.universidad.localhost`)"
      service: "controller"
      entryPoints:
        - http
      middlewares:
        - rate-limit
        - circuit-breaker
        - request-tracing
        - cors-headers

    # User Service (Python) — :8001
    user-service:
      rule: "Host(`user.universidad.localhost`)"
      service: "user-service"
      entryPoints:
        - http
      middlewares:
        - rate-limit
        - cors-headers

    # Extract Service (Python) — :8002
    extract-service:
      rule: "Host(`extract.universidad.localhost`)"
      service: "extract-service"
      entryPoints:
        - http
      middlewares:
        - rate-limit
        - cors-headers

    # Summary Service (Python + Groq) — :8003
    summary-service:
      rule: "Host(`summary.universidad.localhost`)"
      service: "summary-service"
      entryPoints:
        - http
      middlewares:
        - rate-limit
        - cors-headers

    # Persistence Service (Java) — :8004
    persistence-service:
      rule: "Host(`persistence.universidad.localhost`)"
      service: "persistence-service"
      entryPoints:
        - http
      middlewares:
        - rate-limit
        - circuit-breaker
        - cors-headers

  # ─── SERVICES ───────────────────────────────────────────────────────────────

  services:
    controller:
      loadBalancer:
        servers:
          - url: "http://controller:5000"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 5s

    user-service:
      loadBalancer:
        servers:
          - url: "http://user-service:8001"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    extract-service:
      loadBalancer:
        servers:
          - url: "http://extract-service:8002"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    summary-service:
      loadBalancer:
        servers:
          - url: "http://summary-service:8003"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    persistence-service:
      loadBalancer:
        servers:
          - url: "http://persistence-service:8004"
        healthCheck:
          path: /actuator/health
          interval: 30s
          timeout: 5s
