http:
  middlewares:
    # Circuit breaker middleware (global)
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5 || ResponseCodeRatio(500, 600, 0, 600) > 0.3"
    
    # Rate limiting - 100 requests per second per IP
    rate-limit:
      rateLimit:
        average: 100
        period: 1s
        burst: 50
        sourceCriterion:
          ipStrategy:
            depth: 1
    
    # Request tracing header
    request-tracing:
      headers:
        customRequestHeaders:
          X-Service: "NotebookUM-API"
          X-Environment: "production"
    
    # Compression middleware
    compression:
      compress:
        minResponseBodyBytes: 1024

    # CORS headers (global)
    cors-headers:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-User-ID"
          - "X-Correlation-ID"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 3600

  # ─── ROUTERS ────────────────────────────────────────────────────────────────

  routers:
    # Traefik Dashboard
    traefik:
      rule: "Host(`traefik.universidad.localhost`)"
      service: "api@internal"
      entryPoints:
        - http

    # Controller (Go) — API Gateway + Orchestrator — :5000
    controller:
      rule: "Host(`api.universidad.localhost`)"
      service: "controller"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - circuit-breaker
        - request-tracing
        - cors-headers

    # User Service (Python/FastAPI) — :5000
    user-service:
      rule: "Host(`users.universidad.localhost`)"
      service: "user-service"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - cors-headers

    # Extract Service (Python/FastAPI) — :5000
    extract-service:
      rule: "Host(`extractor.universidad.localhost`)"
      service: "extract-service"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - cors-headers

    # Summary/AI Service (Python/FastAPI + Groq) — :5000
    summary-service:
      rule: "Host(`ai.universidad.localhost`)"
      service: "summary-service"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - cors-headers

    # Persistence Service (Java/Spring Boot) — :8080
    persistence-service:
      rule: "Host(`persistence-java.universidad.localhost`)"
      service: "persistence-service"
      entryPoints:
        - http
        - https
      middlewares:
        - rate-limit
        - circuit-breaker
        - cors-headers

    # Consul Service Discovery
    consul:
      rule: "Host(`consul.universidad.localhost`)"
      service: "consul"
      entryPoints:
        - http

  # ─── SERVICES ───────────────────────────────────────────────────────────────

  services:
    controller:
      loadBalancer:
        servers:
          - url: "http://controller:5000"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 5s

    user-service:
      loadBalancer:
        servers:
          - url: "http://user-service:5000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    extract-service:
      loadBalancer:
        servers:
          - url: "http://extract-service:5000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    summary-service:
      loadBalancer:
        servers:
          - url: "http://summary-service:5000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    persistence-service:
      loadBalancer:
        servers:
          - url: "http://persistence-service:8080"
        healthCheck:
          path: /actuator/health
          interval: 30s
          timeout: 5s

    consul:
      loadBalancer:
        servers:
          - url: "http://consul:8500"
