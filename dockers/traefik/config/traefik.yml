global:
  sendAnonymousUsage: true

api:
  dashboard: true
  insecure: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false

  file:
    filename: /etc/traefik/config.yml
    watch: true

  consulCatalog:
    endpoint:
      address: "http://consul:8500"
      # Token is injected via the TRAEFIK_PROVIDERS_CONSULCATALOG_ENDPOINT_TOKEN
      # env var (see dockers/traefik/docker-compose.yml) — never hardcoded here.
    exposedByDefault: false
    prefix: "traefik"
    refreshInterval: "15s"

log:
  level: DEBUG
  format: common

entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"
  redis:
    address: ":6379"
