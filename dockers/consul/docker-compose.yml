services:
  consul:
    image: hashicorp/consul:1.20
    container_name: notebookum-consul
    restart: unless-stopped
    volumes:
      - "./data:/consul/data"
      - "./config:/consul/config"
    command: agent -server -client=0.0.0.0 -bootstrap -ui -data-dir=/consul/data -config-dir=/consul/config -bootstrap-expect=1
    networks:
      - notebookum-network
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"

networks:
  notebookum-network:
    external: true
