services:
  consul:
    image: hashicorp/consul:1.16
    container_name: consul
    restart: unless-stopped
    volumes:
      - "./data:/consul/data"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0
    ports:
      - "8500:8500"
    networks:
      notebookum-network:
        aliases:
          - consul.universidad.localhost
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8500/v1/status/leader"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot job: seeds the Traefik discovery tags every microservice reads
  # back from Consul KV on registration. Runs once per `docker compose up`
  # and exits; re-running it is safe (consul kv put is idempotent).
  kv-seed:
    image: hashicorp/consul:1.16
    container_name: consul-kv-seed
    depends_on:
      consul:
        condition: service_healthy
    environment:
      - CONSUL_HTTP_ADDR=http://consul:8500
      - CONSUL_HTTP_TOKEN=${CONSUL_TOKEN:-}
    volumes:
      - ./kv-seed/seed.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]
    networks:
      - notebookum-network
    restart: "no"

networks:
  notebookum-network:
    external: true
